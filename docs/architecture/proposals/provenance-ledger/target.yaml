scenarios:
  - id: "capture_and_correlate"
    label: "Capture and correlate a bounded event"
    trigger: "An agent, Git, Entire, CI, or GitHub source emits a relevant event."
    preconditions: ["Source identity is known.", "Event contains a run or source id."]
    control_variables: ["event_id", "run_id", "payload_digest", "repository_id", "commit_sha"]
    steps:
      - edge: "agent_to_adapters"
        when: "The agent runtime emits a bounded tool or model event."
        state_effects:
          - node: "source_adapters"
            variable: "source_event_id"
            operation: "accept and normalize source identity"
      - edge: "adapters_to_bus"
        when: "The event passes adapter shape checks."
        state_effects:
          - node: "event_bus"
            variable: "event_id"
            operation: "enqueue canonical event"
      - edge: "bus_to_ingest"
        when: "The queue delivers the event."
        state_effects:
          - node: "ingest_worker"
            variable: "ingest_status"
            operation: "claim idempotent delivery"
      - edge: "ingest_to_canonicalizer"
        when: "The event is not a duplicate."
        state_effects:
          - node: "canonicalizer"
            variable: "redaction_status"
            operation: "redact and classify"
      - edge: "canonicalizer_to_ledger"
        when: "The event passes redaction and schema checks."
        state_effects:
          - node: "provenance_ledger"
            variable: "event_id"
            operation: "persist fact and critical relationships"
      - edge: "canonicalizer_to_artifacts"
        when: "The event references large content."
        state_effects:
          - node: "artifact_store"
            variable: "artifact_sha256"
            operation: "persist content-addressed artifact"
      - edge: "projector_reads_ledger"
        when: "A new ledger revision is available."
        state_effects:
          - node: "projection_worker"
            variable: "projection_revision"
            operation: "consume immutable facts"
      - edge: "projector_writes_read_model"
        when: "Lineage and review projections are rebuilt."
        state_effects:
          - node: "read_model"
            variable: "projection_revision"
            operation: "publish query projection"
    outputs: ["Evidence event, artifact references, and rebuildable lineage projection."]
    failure_outcomes: ["Duplicate is safely ignored.", "Redaction failure rejects event.", "Queue or database outage delays projection.", "Unknown identity is quarantined."]
    observable_signals: ["Ingest latency.", "Duplicate counter.", "Dead-letter count.", "Projection lag.", "Payload digest."]
  - id: "final_head_review"
    label: "Review an exact final head"
    trigger: "A stacked PR or integrated candidate requests readiness."
    preconditions: ["Repository and exact head SHA resolve.", "Relevant validation and security events are present."]
    control_variables: ["repository_id", "head_sha", "manifest_digest", "review_id", "packet_digest"]
    steps:
      - edge: "validation_to_adapters"
        when: "Deterministic validation completes."
        state_effects:
          - node: "validation_worker"
            variable: "decision"
            operation: "emit exact-head validation event"
      - edge: "security_to_adapters"
        when: "Security checks complete."
        state_effects:
          - node: "security_gate"
            variable: "policy_decision"
            operation: "emit security evidence event"
      - edge: "projector_reads_ledger"
        when: "Validation, security, Git, checkpoint, and review events are durable."
        state_effects:
          - node: "projection_worker"
            variable: "projection_revision"
            operation: "rebuild exact-head projections"
      - edge: "projector_writes_read_model"
        when: "The final head projection is current."
        state_effects:
          - node: "read_model"
            variable: "head_sha"
            operation: "publish current head state"
      - edge: "context_reads_projection"
        when: "A scoped review packet is requested."
        state_effects:
          - node: "context_broker"
            variable: "access_decision"
            operation: "authorize project-scoped query"
      - edge: "context_reads_ledger"
        when: "The packet needs exact evidence digests."
        state_effects:
          - node: "context_broker"
            variable: "packet_digest"
            operation: "bind exact facts"
      - edge: "context_to_codex"
        when: "The packet passes scope and freshness checks."
        state_effects:
          - node: "codex_review"
            variable: "head_sha"
            operation: "review bounded context"
      - edge: "codex_to_adapters"
        when: "Codex emits validated findings."
        state_effects:
          - node: "source_adapters"
            variable: "source_event_id"
            operation: "ingest review outcome"
    outputs: ["Exact-head review packet and review findings tied to evidence."]
    failure_outcomes: ["Head change makes prior evidence stale.", "Missing security evidence blocks readiness.", "Out-of-scope context request is denied.", "Codex output is retained as a finding, not approval."]
    observable_signals: ["Stale-head rejection.", "Packet digest.", "Validation decision.", "Security decision.", "Review finding disposition."]
  - id: "promote_project_lesson"
    label: "Promote a project lesson"
    trigger: "Repeated validated outcomes suggest a behavior or workflow lesson."
    preconditions: ["Evidence links resolve.", "Project and privacy scope are known.", "Replay case is reproducible."]
    control_variables: ["case_id", "baseline_version", "candidate_version", "lesson_id", "scope"]
    steps:
      - edge: "evaluation_reads_model"
        when: "A replayable case is selected."
        state_effects:
          - node: "evaluation_worker"
            variable: "outcome"
            operation: "compare baseline and candidate behavior"
      - edge: "evaluation_to_human"
        when: "The comparison meets promotion thresholds."
        state_effects:
          - node: "human_approver"
            variable: "decision"
            operation: "review evidence and scope"
      - edge: "evaluation_writes_lessons"
        when: "The lesson is accepted for its declared scope."
        state_effects:
          - node: "lesson_store"
            variable: "status"
            operation: "store versioned lesson"
      - edge: "context_reads_lessons"
        when: "A later project-scoped run requests applicable guidance."
        state_effects:
          - node: "context_broker"
            variable: "request_scope"
            operation: "retrieve only authorized lesson"
    outputs: ["Versioned lesson with evidence references and explicit scope."]
    failure_outcomes: ["Insufficient recurrence keeps lesson as candidate.", "Privacy review rejects global promotion.", "Regression retires the lesson.", "Missing evidence prevents retrieval."]
    observable_signals: ["Evaluation result.", "Human decision.", "Lesson version.", "Scope and evidence references.", "Later recurrence rate."]

