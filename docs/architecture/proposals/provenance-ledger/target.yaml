    mode: "sync"
    timeout: "30s"
    retries: "none"
    idempotency: "request_id plus packet_digest"
    fallback: "Codex reviews without optional context and marks limitation"
    failure_propagation: "review context is unavailable"
    trust_boundary: true
    evidence_state: "proposed"
    evidence: ["target-design", "openai-observability"]
  - id: "codex_to_adapters"
    from: "codex_review"
