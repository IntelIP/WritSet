    idempotency: "request_id plus head_sha"
    fallback: "return no packet"
    failure_propagation: "agent run starts without context"
    trust_boundary: true
    evidence_state: "proposed"
    evidence: ["target-design", "target-diagrams"]
  - id: "context_reads_ledger"
    from: "context_broker"
    to: "provenance_ledger"
    relationship: "reads"
    label: "Resolve exact facts and digests"
    protocol: "read-only PostgreSQL query"
    contract: "typed lineage and evidence records"
    authentication: "read-only database credential"
    mode: "sync"
    timeout: "2s"
    retries: "one retry"
    idempotency: "request_id plus head_sha"
    fallback: "return packet unavailable"
    failure_propagation: "context request is denied"
    trust_boundary: true
    evidence_state: "proposed"
    evidence: ["target-design", "postgres-constraints"]
  - id: "context_reads_lessons"
    from: "context_broker"
    to: "lesson_store"
    relationship: "reads"
    label: "Read scoped lessons"
    protocol: "read-only query API"
    contract: "versioned lesson and evidence references"
    authentication: "project-scoped authorization"
    mode: "sync"
    timeout: "2s"
    retries: "one retry"
    idempotency: "request_id plus scope plus head_sha"
    fallback: "return context without lessons"
    failure_propagation: "run continues without optional lessons"
    trust_boundary: true
    evidence_state: "proposed"
    evidence: ["target-design"]
  - id: "context_to_codex"
    from: "context_broker"
    to: "codex_review"
    relationship: "calls"
    label: "Provide bounded review context"
    protocol: "MCP or read-only API"
    contract: "scoped context packet"
