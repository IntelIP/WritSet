    retries: "exponential retry up to 5"
    idempotency: "review_id plus head_sha plus finding_digest"
    fallback: "retain review artifact for later import"
    failure_propagation: "review ledger remains pending"
    trust_boundary: true
    evidence_state: "proposed"
    evidence: ["current-review", "target-design"]
  - id: "evaluation_reads_model"
    from: "evaluation_worker"
    to: "read_model"
