scenarios:
  - id: "capture_context"
    label: "Capture an agent run context"
    trigger: "An operator starts an agent-assisted repository run."
    preconditions: ["Repository and task source resolve.", "Worktree can be isolated."]
    control_variables: ["run_id", "base_sha", "head_sha", "checkpoint_id"]
    steps:
      - edge: "cli_to_git"
        when: "The run resolves repository and worktree state."
        state_effects:
          - node: "git_store"
            variable: "worktree"
            operation: "create isolated worktree"
      - edge: "cli_to_entire"
        when: "Checkpoint metadata is required."
        state_effects:
          - node: "context_packet"
            variable: "checkpoint_id"
            operation: "bind checkpoint identity"
      - edge: "cli_to_context"
        when: "Exact base, head, and merge-base are known."
        state_effects:
          - node: "context_packet"
            variable: "context_digest"
            operation: "write integrity-protected packet"
      - edge: "cli_to_evidence"
        when: "Commands, checks, approvals, and artifacts are collected."
        state_effects:
          - node: "evidence_store"
            variable: "run_id"
            operation: "write evidence envelope"
    outputs: ["Context packet and evidence envelope bound to the run."]
    failure_outcomes: ["Unknown checkpoint blocks context capture.", "Integrity or schema validation fails."]
    observable_signals: ["Context digest.", "Evidence validation result.", "Run failure reason."]
  - id: "validate_exact_head"
    label: "Validate an exact commit"
    trigger: "A candidate commit is ready for validation."
    preconditions: ["Manifest is committed.", "Trusted worker is available."]
    control_variables: ["commit_sha", "manifest_digest", "validation_id"]
    steps:
      - edge: "cli_to_validator"
        when: "The runner resolves the exact candidate revision."
        state_effects:
          - node: "validation_worker"
            variable: "decision"
            operation: "execute committed checks"
      - edge: "validator_to_validation_ref"
        when: "The result is complete and publication is approved."
        state_effects:
          - node: "validation_ref"
            variable: "decision"
            operation: "publish exact-head result"
    outputs: ["Durable validation decision tied to commit and manifest."]
    failure_outcomes: ["Worker failure.", "Stale or non-fast-forward publication.", "Validation fails."]
    observable_signals: ["Validation result ref.", "Command statuses.", "Manifest digest."]
  - id: "reconcile_review"
    label: "Reconcile pull-request review"
    trigger: "A pull request or review cycle needs current readiness."
    preconditions: ["PR identity and head SHA resolve.", "Review control ref is writable."]
    control_variables: ["pr_number", "head_sha", "review_id"]
    steps:
      - edge: "review_to_github"
        when: "The review command reads current PR feedback and checks."
        state_effects:
          - node: "review_command"
            variable: "head_sha"
            operation: "freeze current review subject"
      - edge: "review_to_validation_ref"
        when: "The exact validation result is looked up."
        state_effects:
          - node: "review_command"
            variable: "readiness"
            operation: "require matching validation"
      - edge: "review_to_review_ledger"
        when: "Feedback, fixes, and readiness are reconciled."
        state_effects:
          - node: "review_ledger"
            variable: "review_cycle"
            operation: "record current reconciliation"
    outputs: ["Durable review cycle and readiness state."]
    failure_outcomes: ["Head mismatch leaves review stale.", "Missing validation blocks readiness.", "Control-ref conflict preserves prior state."]
    observable_signals: ["Review ledger event.", "Stale-head marker.", "Readiness decision."]

